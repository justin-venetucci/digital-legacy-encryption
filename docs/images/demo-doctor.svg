<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 533" width="708" height="533" role="img" aria-label="The health check verifies the binaries, key list, checksums and the policy sealed in the ciphertext, and warns that key files are still on this machine.">
<title>The health check verifies the binaries, key list, checksums and the policy sealed in the ciphertext, and warns that key files are still on this machine.</title>
<rect width="708" height="533" rx="8" fill="#0d1117"/>
<path d="M0 8a8 8 0 0 1 8-8h692a8 8 0 0 1 8 8v20H0z" fill="#161b22"/>
<circle cx="18" cy="14" r="5.5" fill="#ff5f57"/><circle cx="36" cy="14" r="5.5" fill="#febc2e"/><circle cx="54" cy="14" r="5.5" fill="#28c840"/>
<text x="354.0" y="18.5" text-anchor="middle" fill="#8b949e" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">encrypt.py --doctor</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve">
<text x="18" y="54" textLength="672.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#56d4dd">╔══════════════════════════════════════════════════════════════════════════════╗</tspan></text>
<text x="18" y="73" textLength="672.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#56d4dd">║                                 Health Check                                 ║</tspan></text>
<text x="18" y="92" textLength="672.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#56d4dd">╚══════════════════════════════════════════════════════════════════════════════╝</tspan></text>
<text x="18" y="130" textLength="201.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#56d364">  [ok  ] Helper programs</tspan></text>
<text x="18" y="149" textLength="520.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b949e">         age v1.1.0, age-keygen v1.1.0, age-plugin-sss unknown</tspan></text>
<text x="18" y="168" textLength="218.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#e3b341">  [warn] Version reporting</tspan></text>
<text x="18" y="187" textLength="621.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#e3b341">         age-plugin-sss did not report a version. Not a fault by itself --</tspan></text>
<text x="18" y="206" textLength="294.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#e3b341">         some builds simply do not.</tspan></text>
<text x="18" y="225" textLength="142.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#56d364">  [ok  ] Key list</tspan></text>
<text x="18" y="244" textLength="302.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b949e">         any 2 of 3 keys can decrypt</tspan></text>
<text x="18" y="263" textLength="235.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#56d364">  [ok  ] Encrypted documents</tspan></text>
<text x="18" y="282" textLength="520.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b949e">         Accounts and passwords - Encrypted 2026-10-04.pdf.age</tspan></text>
<text x="18" y="301" textLength="176.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#56d364">  [ok  ] Vault record</tspan></text>
<text x="18" y="320" textLength="495.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b949e">         written 2026-10-04T17:09:17-05:00 by version 2.0.0</tspan></text>
<text x="18" y="339" textLength="630.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#56d364">  [ok  ] Integrity of Accounts and passwords - Encrypted 2026-10-04.pdf.age</tspan></text>
<text x="18" y="358" textLength="210.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b949e">         checksum matches</tspan></text>
<text x="18" y="377" textLength="663.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#56d364">  [ok  ] Policy sealed in Accounts and passwords - Encrypted 2026-10-04.pdf.age</tspan></text>
<text x="18" y="396" textLength="529.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b949e">         the file itself requires 2 keys, matching the key list</tspan></text>
<text x="18" y="415" textLength="310.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#e3b341">  [warn] Private keys on this machine</tspan></text>
<text x="18" y="434" textLength="613.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#e3b341">         3 key file(s) are still in age-keys-DISTRIBUTE-AND-DELETE. Until</tspan></text>
<text x="18" y="453" textLength="646.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#e3b341">         they are handed out and deleted, every key sits on this one computer</tspan></text>
<text x="18" y="472" textLength="495.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#e3b341">         -- the exact situation the scheme exists to avoid.</tspan></text>
<text x="18" y="510" textLength="277.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#e3b341">No faults. 2 things worth a look.</tspan></text>
</g></svg>
